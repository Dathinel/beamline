# Política de licencias y avisos de beamline-red: la de Sala/red/deny.toml (solo permisivas; nada GPL ni no libre)
# más lo propio de BeamLine, que tira de iroh-mdns-address-lookup.
[graph]
all-features = false

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0", "Unlicense"]
confidence-threshold = 0.9
# BeamLine mismo es GPLv3 (Daniel, 23-nov); sus dependencias siguen teniendo que ser permisivas.
exceptions = [{ allow = ["GPL-3.0-only"], crate = "beamline-red" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# dathinel-red llega por ruta (el submódulo Sala), sin versión: no es un comodín de crates.io.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: macro de compilación de una dependencia de iroh, sin código en el binario (igual que Sala)" },
    { id = "RUSTSEC-2026-0543", reason = "chrono sin mantenimiento, sin vulnerabilidad conocida; llega por iroh (igual que Sala)" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill sin mantenimiento, sin vulnerabilidad; llega por iroh-mdns-address-lookup" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error sin mantenimiento: macro de compilación del mDNS (swarm-discovery), sin código en el binario" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
