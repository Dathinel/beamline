[package]
name = "beamline-poc"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["portmapper", "tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
anyhow = "1"
iroh-blobs = "0.105"
blake3 = { version = "1.8.7", features = ["mmap"] }
n0-future = "0.3"

[profile.release]
lto = true
codegen-units = 1

[features]
prueba = ["iroh/test-utils"]
